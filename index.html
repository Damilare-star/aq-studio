<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AQ Studio" />
    <meta property="og:title" content="AI Video Ads That Stop the Scroll & Increase Sales" />

    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aqstudio" />
    <meta name="twitter:creator" content="@aqstudio" />
    <meta name="twitter:title" content="AI Video Ads That Stop the Scroll & Increase Sales" />
    <meta name="twitter:description" content="Premium AI video advertisements for brands and eCommerce stores. Real results, real revenue." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Canonical -->
    <link rel="canonical" href="https://aqstudio.com" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Preconnect CDNs for images -->
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Structured Data — Person/Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "AQ Studio",

        "https://linkedin.com/company/aqstudio",
        "https://tiktok.com/@aqstudio"
      ],
      "offers": [
        { "@type": "Offer", "name": "AI Video Ads" },
        { "@type": "Offer", "name": "Shopify Website Design" },
